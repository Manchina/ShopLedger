<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, routers, library modules, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 12px Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .text { font: 12px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .box { stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .browser { fill: #eff6ff; stroke: #2563eb; }
      .server { fill: #f8fafc; stroke: #334155; }
      .router { fill: #f0fdf4; stroke: #16a34a; }
      .lib { fill: #f8fafc; stroke: #64748b; }
      .data { fill: #fff7ed; stroke: #ea580c; }
      .ticket { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .flow { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .flownum { fill: #2563eb; }
      .flowtext { font: 12px Arial, sans-serif; fill: #1e293b; }
      .arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flowarrow { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrowBlue); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="34" class="title">ShopLedger architecture</text>
  <text x="30" y="55" class="subtitle">Node/Express POS, Khata credit ledger, GST pricing, printable invoice, and JSON persistence</text>

  <text x="30" y="82" class="section">Runtime components</text>

  <!-- Browser UI -->
  <rect x="30" y="98" width="240" height="205" class="box browser"/>
  <text x="48" y="124" class="label">Browser UI — public/</text>
  <text x="48" y="148" class="text">index.html</text>
  <text x="48" y="168" class="text">js/app.js</text>
  <text x="48" y="188" class="text">css/style.css</text>
  <text x="48" y="220" class="small">POS cart, coupons, customers,</text>
  <text x="48" y="238" class="small">orders, settlements, reports</text>
  <text x="48" y="274" class="label">POST /api/orders</text>

  <!-- Server -->
  <rect x="320" y="132" width="205" height="120" class="box server"/>
  <text x="338" y="158" class="label">server.js</text>
  <text x="338" y="181" class="text">Express + bodyParser.json()</text>
  <text x="338" y="201" class="text">express.static(public/)</text>
  <text x="338" y="221" class="text">mounts /api routers</text>
  <text x="338" y="241" class="text">GET /orders/:id/invoice</text>

  <!-- Routers -->
  <rect x="570" y="78" width="245" height="332" class="box router"/>
  <text x="588" y="104" class="label">routes/ — Express routers</text>
  <rect x="588" y="118" width="209" height="56" class="box router"/>
  <text x="601" y="140" class="label">products.js</text>
  <text x="601" y="158" class="small">GET /products, /coupons</text>
  <rect x="588" y="184" width="209" height="78" class="box router"/>
  <text x="601" y="206" class="label">orders.js</text>
  <text x="601" y="224" class="small">GET/POST /orders</text>
  <text x="601" y="242" class="small">POST /orders/:id/cancel</text>
  <rect x="588" y="272" width="209" height="56" class="box router"/>
  <text x="601" y="294" class="label">customers.js</text>
  <text x="601" y="312" class="small">GET /customers, settle</text>
  <rect x="588" y="338" width="209" height="56" class="box router"/>
  <text x="601" y="360" class="label">reports.js</text>
  <text x="601" y="378" class="small">dashboard, GST, preview, export</text>

  <!-- Data -->
  <rect x="920" y="98" width="235" height="168" class="box data"/>
  <text x="938" y="125" class="label">data/db.json</text>
  <text x="938" y="149" class="text">products</text>
  <text x="938" y="167" class="text">customers + settlements</text>
  <text x="938" y="185" class="text">orders + nextOrderId</text>
  <text x="938" y="203" class="text">auditLog + nextSettlementId</text>
  <text x="938" y="239" class="small">read/write via lib/store.js</text>

  <!-- Libraries -->
  <rect x="835" y="292" width="320" height="194" class="box lib"/>
  <text x="853" y="318" class="label">lib/ — domain modules</text>

  <rect x="853" y="332" width="142" height="40" class="box lib"/>
  <text x="864" y="349" class="label">store.js</text>
  <text x="864" y="365" class="small">read, write, audit</text>
  <rect x="1005" y="332" width="132" height="40" class="box lib"/>
  <text x="1016" y="349" class="label">orders.js</text>
  <text x="1016" y="365" class="small">add, get, cancel, list</text>

  <rect x="853" y="378" width="142" height="40" class="box lib"/>
  <text x="864" y="395" class="label">inventory.js</text>
  <text x="864" y="411" class="small">find, check, reserve</text>
  <rect x="1005" y="378" width="132" height="40" class="box lib"/>
  <text x="1016" y="395" class="label">ledger.js</text>
  <text x="1016" y="411" class="small">Khata, settlements</text>

  <rect x="853" y="424" width="142" height="40" class="box lib"/>
  <text x="864" y="441" class="label">pricing.js</text>
  <text x="864" y="457" class="small">subtotal, computeTotals</text>
  <rect x="1005" y="424" width="132" height="40" class="box ticket"/>
  <text x="1016" y="441" class="label">invoice.js</text>
  <text x="1016" y="457" class="small">figures, render</text>

  <rect x="30" y="330" width="240" height="156" class="box lib"/>
  <text x="48" y="356" class="label">Supporting lib/ modules</text>
  <text x="48" y="378" class="text">tax.js — getRateForItem, splitCgstSgst</text>
  <text x="48" y="398" class="text">coupons.js — validate, calculateDiscount</text>
  <text x="48" y="418" class="text">reports.js — dashboard, reconciliation</text>
  <text x="48" y="438" class="text">dates.js — today, date normalization</text>
  <text x="48" y="466" class="small">tax.js participates in checkout pricing</text>

  <!-- config -->
  <rect x="320" y="292" width="205" height="96" class="box server"/>
  <text x="338" y="318" class="label">config.js</text>
  <text x="338" y="340" class="text">shop + port + adminKey</text>
  <text x="338" y="360" class="text">tax.hsnSlabs + coupons</text>
  <text x="338" y="380" class="text">inventory defaults</text>

  <!-- Architecture arrows -->
  <path d="M270 198 L320 198" class="arrow"/>
  <path d="M525 190 L570 190" class="arrow"/>
  <path d="M692 410 L692 454 L835 454" class="arrow dashed"/>
  <path d="M815 224 L920 180" class="arrow"/>
  <path d="M815 336 L920 210" class="arrow dashed"/>
  <path d="M525 340 L835 340" class="arrow dashed"/>
  <path d="M835 464 L270 464" class="arrow dashed"/>
  <text x="735" y="447" class="small">router calls domain logic</text>
  <text x="830" y="282" class="small">JSON persistence</text>

  <!-- Numbered order flow -->
  <text x="30" y="530" class="section">Numbered flow: placing an order</text>
  <rect x="30" y="548" width="260" height="76" class="flow"/>
  <circle cx="55" cy="574" r="14" class="flownum"/><text x="51" y="579" fill="#fff" class="label">1</text>
  <text x="80" y="571" class="flowtext">public/js/app.js</text>
  <text x="80" y="590" class="flowtext">builds cart payload → POST /api/orders</text>

  <rect x="320" y="548" width="260" height="76" class="flow"/>
  <circle cx="345" cy="574" r="14" class="flownum"/><text x="341" y="579" fill="#fff" class="label">2</text>
  <text x="370" y="571" class="flowtext">routes/orders.js</text>
  <text x="370" y="590" class="flowtext">store.read(); resolve products</text>

  <rect x="610" y="548" width="260" height="76" class="flow"/>
  <circle cx="635" cy="574" r="14" class="flownum"/><text x="631" y="579" fill="#fff" class="label">3</text>
  <text x="660" y="571" class="flowtext">inventory.check()</text>
  <text x="660" y="590" class="flowtext">reject insufficient sellable stock</text>

  <rect x="900" y="548" width="260" height="76" class="flow"/>
  <circle cx="925" cy="574" r="14" class="flownum"/><text x="921" y="579" fill="#fff" class="label">4</text>
  <text x="950" y="571" class="flowtext">pricing.computeTotals()</text>
  <text x="950" y="590" class="flowtext">coupons + tax slabs + totals</text>

  <path d="M290 586 L320 586" class="flowarrow"/>
  <path d="M580 586 L610 586" class="flowarrow"/>
  <path d="M870 586 L900 586" class="flowarrow"/>

  <rect x="30" y="652" width="260" height="76" class="flow"/>
  <circle cx="55" cy="678" r="14" class="flownum"/><text x="51" y="683" fill="#fff" class="label">5</text>
  <text x="80" y="675" class="flowtext">ledger.chargeOrderToKhata()</text>
  <text x="80" y="694" class="flowtext">only for paymentMode = khata</text>

  <rect x="320" y="652" width="260" height="76" class="flow"/>
  <circle cx="345" cy="678" r="14" class="flownum"/><text x="341" y="683" fill="#fff" class="label">6</text>
  <text x="370" y="675" class="flowtext">inventory.reserve()</text>
  <text x="370" y="694" class="flowtext">decreases product stock</text>

  <rect x="610" y="652" width="260" height="76" class="flow"/>
  <circle cx="635" cy="678" r="14" class="flownum"/><text x="631" y="683" fill="#fff" class="label">7</text>
  <text x="660" y="675" class="flowtext">orders.add() + appendAudit()</text>
  <text x="660" y="694" class="flowtext">append order and audit entry</text>

  <rect x="900" y="652" width="260" height="76" class="flow"/>
  <circle cx="925" cy="678" r="14" class="flownum"/><text x="921" y="683" fill="#fff" class="label">8</text>
  <text x="950" y="675" class="flowtext">store.write(db)</text>
  <text x="950" y="694" class="flowtext">persist db.json; return 201</text>

  <path d="M1030 624 L1030 652" class="flowarrow"/>
  <path d="M900 690 L870 690" class="flowarrow"/>
  <path d="M610 690 L580 690" class="flowarrow"/>
  <path d="M320 690 L290 690" class="flowarrow"/>

  <!-- Legend -->
  <rect x="835" y="294" width="0" height="0" fill="none"/>
  <rect x="930" y="744" width="16" height="16" class="ticket"/>
  <text x="954" y="757" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="1110" y="744" width="16" height="16" class="router"/>
  <text x="1130" y="757" class="small">Router</text>
  <text x="30" y="757" class="small">Solid arrows: request/data path  ·  Dashed arrows: shared dependency or persistence relationship</text>
</svg>
